<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7E8">
  <title>Talk Buddy – 상황별 영어·일본어 회화 친구 (초등·중등·고등·일반)</title>
  <!-- PWA: 휴대폰 홈 화면에 앱처럼 설치 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Talk Buddy">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-back" aria-label="뒤로" hidden>←</button>
      <button class="brand" id="brand" aria-label="홈으로"><span class="brand-emoji">🗣️</span> Talk Buddy</button>
      <div class="topbar-right">
        <span id="streak-badge" class="badge" title="연속 학습 일수">🔥 0일</span>
      </div>
    </header>

    <main id="main" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="메인 메뉴">
      <button data-nav="home"><span class="nav-emoji">🏠</span><span>홈</span></button>
      <button data-nav="scenarios"><span class="nav-emoji">🎭</span><span>상황</span></button>
      <button data-nav="games"><span class="nav-emoji">🎮</span><span>게임</span></button>
      <button data-nav="history"><span class="nav-emoji">📊</span><span>기록</span></button>
      <button data-nav="settings"><span class="nav-emoji">⚙️</span><span>설정</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status"></div>

  <script src="js/scenarios.js"></script>
  <script src="js/scenarios_ja.js"></script>
  <script src="js/scenarios_middle.js"></script>
  <script src="js/scenarios_high.js"></script>
  <script src="js/scenarios_adult.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/vocab.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 서비스 워커 등록 (https 또는 localhost에서만 동작)
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW 등록 실패', err)));
    }
  </script>
</body>
</html>
